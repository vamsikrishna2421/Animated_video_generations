<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(permanent-marker-latin-400-normal.woff2)}
@font-face{font-family:P;src:url(patrick-hand-latin-400-normal.woff2)}
html,body{margin:0;width:1920px;height:1080px;background:#000;overflow:hidden}
.ph{position:absolute;left:470px;top:0;height:1080px;width:1450px;background:url(dog_clean.jpg) 0 0/1450px auto no-repeat;
 filter:saturate(.9) contrast(1.08) brightness(.86)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#000 24%,rgba(0,0,0,.6) 38%,rgba(0,0,0,0) 55%),radial-gradient(ellipse at 66% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,40,60,.18),rgba(60,20,0,.12));mix-blend-mode:soft-light}
